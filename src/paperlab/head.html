<title>Safe-DFKT 论文实验室</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Serif+SC:wght@600;900&family=Noto+Sans+SC:wght@400;500;700&family=JetBrains+Mono:wght@400;600&display=swap">
<style>
/* 布局：一页长卷，左对齐的“实验记录本”；顶部吸附的章节导航；图表和交互放在白色记录卡里 */
:root{
  --bg:#f3f5f7; --paper:#ffffff; --ink:#15202b; --muted:#5b6672; --line:#dde3e9; --soft:#eef1f4;
  --s1:#2a78d6; --s2:#eb6834; --s3:#1baf7a; --good:#1baf7a; --bad:#e34948; --warn:#eda100;
  --f-display:"Noto Serif SC","Songti SC",serif; --f-body:"Noto Sans SC","PingFang SC","Microsoft YaHei",system-ui,sans-serif; --f-mono:"JetBrains Mono",ui-monospace,Menlo,monospace;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0f151b; --paper:#161f28; --ink:#e7ecf1; --muted:#9aa7b4; --line:#2a3642; --soft:#1c2733;
  --s1:#3987e5; --s2:#d95926; --s3:#199e70; --good:#199e70; --bad:#e66767; --warn:#c98500; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0f151b; --paper:#161f28; --ink:#e7ecf1; --muted:#9aa7b4; --line:#2a3642; --soft:#1c2733;
  --s1:#3987e5; --s2:#d95926; --s3:#199e70; --good:#199e70; --bad:#e66767; --warn:#c98500; color-scheme:dark}
*{box-sizing:border-box}
html{scroll-behavior:smooth}
@media (prefers-reduced-motion:reduce){html{scroll-behavior:auto}}
body{background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:15.5px;line-height:1.75}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--paper)}
.wrap{max-width:1080px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
nav.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:9;background:var(--paper);border-bottom:1px solid var(--line)}
nav.top .wrap{display:flex;gap:4px;overflow-x:auto;padding-block:8px;scrollbar-width:none}
nav.top a{flex:none;color:var(--muted);text-decoration:none;font-size:14px;padding:4px 10px;border-radius:999px;white-space:nowrap}
nav.top a:hover,nav.top a:focus-visible{background:var(--soft);color:var(--ink);outline:none}
nav.top b{flex:none;font-family:var(--f-display);font-weight:900;margin-right:8px;font-size:15px;align-self:center}
h1,h2,h3{font-family:var(--f-display);text-wrap:balance;margin:0;line-height:1.3}
h1{font-size:clamp(28px,5vw,44px);font-weight:900}
h2{font-size:clamp(22px,3.4vw,28px);font-weight:900}
h3{font-size:17px;font-weight:600}
p{margin:0}
.lead{font-size:17px;color:var(--muted);max-width:68ch}
section{padding-block:40px 8px;scroll-margin-top:56px}
.sh{display:grid;gap:6px;margin-bottom:16px;max-width:72ch}
.eyebrow{font-family:var(--f-mono);font-size:12px;letter-spacing:.08em;color:var(--s1);text-transform:uppercase}
.card{background:var(--paper);border:1px solid var(--line);border-radius:12px;padding:16px;min-width:0}
.grid2{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,420px),1fr));gap:16px}
.stack{display:grid;gap:12px;align-content:start;min-width:0}
.muted{color:var(--muted)} .small{font-size:13px} .mono{font-family:var(--f-mono);font-variant-numeric:tabular-nums}
.row{display:flex;flex-wrap:wrap;gap:8px 14px;align-items:center}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{font:inherit;font-size:13.5px;border:1px solid var(--line);background:var(--paper);color:var(--ink);padding:4px 12px;border-radius:999px;cursor:pointer}
.chip[aria-pressed="true"]{background:var(--ink);color:var(--paper);border-color:var(--ink)}
.chip:focus-visible,select:focus-visible,button:focus-visible,input:focus-visible{outline:2px solid var(--s1);outline-offset:2px}
select,input[type=range]{font:inherit;font-size:14px}
select{background:var(--paper);color:var(--ink);border:1px solid var(--line);border-radius:8px;padding:4px 8px;max-width:100%}
label.ctl{display:grid;gap:2px;font-size:13px;color:var(--muted)}
.btn{font:inherit;font-size:14px;border:1px solid var(--ink);background:var(--ink);color:var(--paper);padding:6px 14px;border-radius:8px;cursor:pointer}
.btn.ghost{background:transparent;color:var(--ink)}
.tiles{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,190px),1fr));gap:12px}
.tile{background:var(--paper);border:1px solid var(--line);border-radius:12px;padding:12px 14px;display:grid;gap:2px;min-width:0}
.tile .k{font-size:13px;color:var(--muted)}
.tile .v{font-family:var(--f-mono);font-size:24px;font-weight:600;font-variant-numeric:tabular-nums}
.tile .v small{display:block;font-size:13px;color:var(--muted);font-weight:400}
.tile .src{font-size:11.5px;color:var(--muted)}
.tag{display:inline-block;font-size:11.5px;padding:1px 8px;border-radius:999px;border:1px solid var(--line);color:var(--muted);white-space:nowrap}
.tag.ours{border-color:var(--s2);color:var(--s2)} .tag.good{border-color:var(--good);color:var(--good)} .tag.bad{border-color:var(--bad);color:var(--bad)}
.flow{display:grid;gap:10px}
.lane{display:flex;flex-wrap:wrap;align-items:stretch;gap:6px}
.lane .lb{font-family:var(--f-mono);font-size:12px;color:var(--muted);width:100%}
.step{flex:1 1 140px;background:var(--soft);border-radius:8px;padding:8px 10px;font-size:13.5px;line-height:1.5;position:relative;min-width:0}
.step b{display:block;font-size:14px}
.step.key{background:color-mix(in srgb,var(--s2) 14%,var(--paper));}
.tblwrap{overflow-x:auto}
table{border-collapse:collapse;width:100%;font-size:13.5px}
th,td{padding:6px 8px;border-bottom:1px solid var(--line);text-align:left;vertical-align:top}
th{font-weight:500;color:var(--muted);font-size:12.5px}
td.n{font-family:var(--f-mono);font-variant-numeric:tabular-nums;text-align:right;white-space:nowrap}
tr.hl td{background:color-mix(in srgb,var(--s2) 9%,transparent)}
.models{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,300px),1fr));gap:10px}
.mcard{font:inherit;text-align:left;color:var(--ink);background:var(--paper);border:1px solid var(--line);border-radius:10px;padding:10px 12px;cursor:pointer;display:grid;gap:4px;min-width:0}
.mcard[aria-pressed="true"]{border-color:var(--s2);box-shadow:0 0 0 1px var(--s2)}
.mcard .nm{font-weight:700}
.mcard .nums{font-family:var(--f-mono);font-size:12.5px;color:var(--muted)}
.chart{width:100%;overflow-x:auto}
.chart svg{display:block;max-width:none}
.chart text{fill:var(--muted);font-family:var(--f-mono);font-size:11px}
.chart .lab{fill:var(--ink);font-family:var(--f-body);font-size:12px}
.legend{display:flex;flex-wrap:wrap;gap:4px 14px;font-size:12.5px;color:var(--muted)}
.legend i{display:inline-block;width:10px;height:10px;border-radius:50%;margin-right:5px;vertical-align:-1px}
#tip{position:fixed;z-index:20;pointer-events:none;background:var(--ink);color:var(--paper);font-size:12.5px;line-height:1.5;padding:6px 9px;border-radius:6px;max-width:280px;opacity:0;transition:opacity .1s}
.note{font-size:13.5px;color:var(--muted);border-left:3px solid var(--line);padding-left:10px}
.callout{background:color-mix(in srgb,var(--s2) 8%,var(--paper));border:1px solid color-mix(in srgb,var(--s2) 40%,var(--line));border-radius:10px;padding:12px 14px}
.traj{display:grid;grid-template-columns:repeat(auto-fill,minmax(30px,1fr));gap:3px}
.traj div{font-family:var(--f-mono);font-size:11px;text-align:center;border-radius:4px;padding:3px 0;border-top:3px solid transparent;background:var(--soft)}
.traj div.ok{border-top-color:var(--good)} .traj div.no{border-top-color:var(--bad)}
.traj div.m{background:color-mix(in srgb,var(--s1) 55%,var(--paper));color:var(--ink)}
.traj div.lr{outline:2px solid var(--s2);outline-offset:-2px}
.hist td{font-size:13px}
.skgrid{display:grid;grid-template-columns:repeat(6,minmax(0,1fr));gap:4px}
.sk{display:flex;flex-direction:column;align-items:center;border:1px solid var(--line);border-radius:6px;padding:4px 0;background:var(--soft);font-family:var(--f-mono);font-size:12px;line-height:1.3}
.sk span{font-size:10.5px;color:var(--muted)}
.sk.m{background:color-mix(in srgb,var(--s1) 55%,var(--paper))}.sk.m span{color:var(--ink)}
.sk.cur{outline:3px solid var(--s2);outline-offset:-2px}
footer{padding-block:40px 60px;color:var(--muted);font-size:13px}
a{color:var(--s1)}
</style>
